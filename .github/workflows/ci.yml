name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x', cache: true, cache-dependency-path: '**/*.csproj' }
      - run: dotnet restore CGSmartK.sln
      - run: dotnet build CGSmartK.sln --configuration Release --no-restore
      - run: dotnet test CGSmartK.sln --configuration Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: TestResults, retention-days: 7 }
